<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lullabark</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#BDE3FB">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-top">
                <div class="logo-container">
                    <img src="Graphics/Lullibark_Logo_Color_Transparent.png" alt="Lullabark Logo" class="app-logo">
                    <h1>Lullabark</h1>
                </div>
                <button id="network-btn" class="icon-btn" aria-label="Network Session" title="Network Session">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
                </button>
            </div>
        </header>

        <main>
            <section class="card time-card">
                <h2>Wake Up Time</h2>
                <div class="time-picker-wrapper">
                    <input type="time" id="wake-time" required>
                </div>
                <div class="presets-row">
                    <button id="save-preset-btn" class="save-preset-btn" title="Save as shortcut">Save</button>
                    <div id="presets-container" class="presets-container"></div>
                </div>
            </section>

            <section class="card audio-card">
                <h2>Sound Settings</h2>
                
                <div class="setting-group">
                    <div class="setting-header">
                        <label for="white-noise-select">White Noise Sound</label>
                    </div>
                    <select id="white-noise-select">
                        <option value="Sounds/03-White-Noise-10min.mp3">Classic White Noise</option>
                    </select>
                    <div class="upload-group">
                        <input type="file" id="upload-noise" accept="audio/*" class="file-input">
                        <label for="upload-noise" class="upload-btn">Upload Custom Noise</label>
                        <button class="test-btn" id="test-noise-btn">Test (Hold)</button>
                    </div>
                    <div class="volume-control">
                        <label for="noise-volume">Volume</label>
                        <input type="range" id="noise-volume" min="0" max="1" step="0.01" value="0.5">
                    </div>
                </div>

                <div class="divider"></div>

                <div class="setting-group">
                    <div class="setting-header">
                        <label for="alarm-select">Alarm Sound</label>
                    </div>
                    <select id="alarm-select">
                        <option value="Sounds/clock_sound_soft.mp3">Soft Clock Alarm</option>
                    </select>
                    <div class="upload-group">
                        <input type="file" id="upload-alarm" accept="audio/*" class="file-input">
                        <label for="upload-alarm" class="upload-btn">Upload Custom Alarm</label>
                        <button class="test-btn" id="test-alarm-btn">Test (Hold)</button>
                    </div>
                    <div class="volume-control">
                        <label for="alarm-volume">Volume</label>
                        <input type="range" id="alarm-volume" min="0" max="1" step="0.01" value="0.5">
                    </div>
                </div>
            </section>

            <div class="action-section">
                <button id="start-btn" class="primary-btn">Start Sleep Mode</button>
                <button id="stop-btn" class="secondary-btn hidden">Stop & Reset</button>
            </div>
            
            <div id="status-display" class="status-display hidden">
                <div class="pulse-ring"></div>
                <p id="status-text">Sleep Mode Active...</p>
                <p id="countdown-text"></p>
            </div>
        </main>
    </div>

    <div class="app-version">version 1.2.1</div>

    <!-- Network Modal -->
    <div id="network-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <button id="close-modal-btn" class="close-btn">&times;</button>
            <h2>Network Session</h2>
            <p id="modal-subtitle" class="modal-subtitle">Sync across devices</p>
            
            <div id="host-code-display" class="host-code-display hidden"></div>
            
            <div class="network-status-container">
                <p id="network-status-text">Status: <strong>Disconnected</strong></p>
            </div>

            <div class="session-inputs" id="session-setup-view">
                <input type="text" id="session-tag" placeholder="Enter 4-character Code" autocomplete="off" maxlength="4">
                <div class="network-actions">
                    <button id="join-session-btn" class="blue-btn">Join</button>
                    <button id="host-session-btn" class="primary-btn">Host New Session</button>
                </div>
            </div>

            <div class="session-active-view hidden" id="session-active-view">
                <button id="leave-session-btn" class="secondary-btn">Disconnect</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
